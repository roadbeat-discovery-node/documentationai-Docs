openapi: 3.0.0
paths:
  /api/v1/search:
    post:
      operationId: SearchController_search
      summary: Search content with filters, facets, and geo
      description: >-
        Full-featured content search across all indexed teasers. Supports text
        search with multilingual analyzers, classification filters, temporal
        filters, geographic distance/bounding-box, publisher filters, custom
        aggregations, sorting, and pagination.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequestDto'
      responses:
        '201':
          description: ''
      tags:
        - search
  /api/v1/search/by-goal:
    post:
      operationId: SearchController_searchByGoal
      summary: Search content by goal template
      description: >-
        Goal-driven search that loads a filterset template from schemas/goals/,
        substitutes user-provided parameters (e.g. `{{city}}`), executes
        multiple content queries in parallel, and returns merged, deduplicated
        results ranked by relevance.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalSearchDto'
      responses:
        '201':
          description: ''
      tags:
        - search
  /api/v1/search/by-goals:
    post:
      operationId: SearchController_searchByGoalBatch
      summary: Batched goal search — single ES query from multiple content_queries
      description: >-
        Accepts pre-resolved content_queries from one or many goals, builds a
        single Elasticsearch bool.should query, and returns merged results
        ranked by relevance. Supports random mode for surprise/serendipity
        discovery.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalBatchSearchDto'
      responses:
        '201':
          description: ''
      tags:
        - search
  /api/v1/search/suggestions:
    get:
      operationId: SearchController_getSuggestions
      summary: Get search autocomplete suggestions
      description: >-
        Returns up to 8 headline-based suggestions using phrase_prefix and fuzzy
        matching. Cached for 60 seconds.
      parameters:
        - name: q
          required: true
          in: query
          description: Search query (min 2 characters)
          schema:
            example: renewable energy
            type: string
        - name: content_types
          required: false
          in: query
          description: Comma-separated content types to limit suggestions
          schema:
            example: news,events
            type: string
      responses:
        '200':
          description: ''
      tags:
        - search
  /api/v1/embedding/status:
    get:
      operationId: EmbeddingController_getStatus
      summary: Get embedding service status
      description: Returns model info and outdated document counts.
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - embedding
  /api/v1/embedding/refresh:
    post:
      operationId: EmbeddingController_triggerRefresh
      summary: Trigger embedding refresh (admin)
      description: >-
        Manually triggers re-embedding of documents with missing or outdated
        embeddings.
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - embedding
  /api/v1/embedding/similar/{teaserId}:
    post:
      operationId: EmbeddingController_findSimilar
      summary: Find similar teasers (more like this)
      description: >-
        Returns teasers similar to the given one (its `teaser_id` or document
        `_id`). Uses the embedding vectors when the embedding service is enabled
        and the teaser has one; otherwise (and if the vector search fails)
        Elasticsearch `more_like_this` over headline, description, categories,
        topics and tags. `method` in the response says which. The teaser itself,
        expired teasers and teasers of switched-off publishers are never
        returned.
      parameters:
        - name: teaserId
          required: true
          in: path
          description: teaser_id (as in search results) or the document _id
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: 1-50, default 10
          schema:
            type: number
        - name: index
          required: false
          in: query
          description: '"roadbeat-content-*" (default) or "roadbeat-content-<content type>"'
          schema:
            type: string
      responses:
        '201':
          description: Similar teasers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarTeasersResponseDto'
        '400':
          description: >-
            `index` is neither `roadbeat-content-*` nor
            `roadbeat-content-<content type>`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - embedding
  /api/v1/embedding/search:
    post:
      operationId: EmbeddingController_semanticSearch
      summary: Semantic vector search
      description: >-
        Search using a text query converted to an embedding vector. Returns
        results ranked by cosine similarity.
      parameters: []
      responses:
        '201':
          description: ''
      tags:
        - embedding
  /api/v1/stats/dashboard:
    get:
      operationId: StatisticsController_getDashboard
      summary: Get combined dashboard statistics
      description: >-
        Returns index stats, publisher stats, query performance, and recent
        daily stats.
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - statistics
  /api/v1/stats/index:
    get:
      operationId: StatisticsController_getIndexStats
      summary: Get index statistics
      description: Document counts per content type, store sizes, index health.
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - statistics
  /api/v1/stats/publishers:
    get:
      operationId: StatisticsController_getPublisherStats
      summary: Get publisher statistics
      description: Publisher counts by type, verification status, and trust level.
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - statistics
  /api/v1/stats/performance:
    get:
      operationId: StatisticsController_getPerformance
      summary: Get query performance metrics
      description: In-memory latency percentiles (p50, p95, p99) and query count.
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - statistics
  /api/v1/stats/daily:
    get:
      operationId: StatisticsController_getDailyStats
      summary: Get daily statistics history
      parameters:
        - name: days
          required: false
          in: query
          description: 'Number of days to look back (default: 30)'
          schema:
            type: number
      responses:
        '200':
          description: ''
      tags:
        - statistics
  /api/v1/publishers/register:
    post:
      operationId: PublishersController_register
      summary: Register a new publisher
      description: >-
        Registers a new publisher with the discovery node. Returns the publisher
        record and a one-time API key. Optionally verifies domain ownership via
        DNS TXT record.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPublisherDto'
      responses:
        '201':
          description: ''
      tags:
        - publishers
  /api/v1/publishers/me/public-key:
    put:
      operationId: PublishersController_updateOwnPublicKey
      summary: Replace the own Ed25519 public key
      description: >-
        Replaces the publisherâ€™s Ed25519 public key. The request must prove
        possession of the NEW key: `signature` is the base64 Ed25519 signature
        of `roadbeat-key-rotation:<publisherId>:<timestamp>` made with the new
        key, and `timestamp` (ISO 8601) is at most 5 minutes old. Reachable
        while the publisher is deactivated by its owner.
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key (`rb_pub_â€¦`) of the calling publisher
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated publisher record (owner view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnPublisherDto'
        '400':
          description: >-
            Not an Ed25519 PEM key, or the proof of possession is invalid /
            older than 5 minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Missing or invalid X-Publisher-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnPublicKeyDto'
  /api/v1/publishers/me:
    get:
      operationId: PublishersController_getOwn
      summary: Who the publisher key belongs to
      description: >-
        Returns { id, name, domain } of the calling publisher — a client can
        check it before it writes.
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key (`rb_pub_â€¦`) of the calling publisher
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Identity of the calling publisher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherIdentityDto'
        '401':
          description: Missing or invalid X-Publisher-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: Publisher is deactivated by its owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
  /api/v1/publishers/me/description:
    put:
      operationId: PublishersController_updateOwnDescription
      summary: Set or remove the own "About" text
      description: >-
        Body: { description } — { "<two-letter language>": "<plain text, max.
        2000 characters>" }, or null to remove it.
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key (`rb_pub_â€¦`) of the calling publisher
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated publisher record (owner view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnPublisherDto'
        '400':
          description: >-
            Not an object, a key is not a two-letter language, a text is longer
            than 2,000 characters, or more than 30 languages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Missing or invalid X-Publisher-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: Publisher is deactivated by its owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnDescriptionDto'
  /api/v1/publishers/me/avatar:
    put:
      operationId: PublishersController_updateOwnAvatar
      summary: Set or remove the own publisher picture
      description: >-
        Body: { avatar_url } - a file inside the own verified Content Pod (pod
        publishers), or null to remove it. Opt-in by the owner.
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key (`rb_pub_â€¦`) of the calling publisher
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated publisher record (owner view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnPublisherDto'
        '400':
          description: >-
            The URL is not a file inside the publisherâ€™s own verified Content
            Pod
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Missing or invalid X-Publisher-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: Publisher is deactivated by its owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnAvatarDto'
  /api/v1/publishers/me/deactivate:
    post:
      operationId: PublishersController_deactivateSelf
      summary: Deactivate the own publisher (no ingest until reactivated)
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key (`rb_pub_â€¦`) of the calling publisher
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Publisher deactivated â€” updated record (owner view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnPublisherDto'
        '401':
          description: Missing or invalid X-Publisher-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403':
          description: Publisher is already deactivated by its owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
      description: >-
        Switches the own publisher off: no ingest, and all its teasers disappear
        from search, lookups and "more like this" (they stay in the index, so
        reactivation restores them instantly). While deactivated, only
        `reactivate` and `me/public-key` accept the key.
  /api/v1/publishers/me/reactivate:
    post:
      operationId: PublishersController_reactivateSelf
      summary: Reactivate the own publisher
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key (`rb_pub_â€¦`) of the calling publisher
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Publisher reactivated â€” updated record (owner view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnPublisherDto'
        '401':
          description: Missing or invalid X-Publisher-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
      description: >-
        Switches the own publisher back on; its teasers are visible again
        immediately.
  /api/v1/publishers/{id}/pod-sync:
    post:
      operationId: PublishersController_podSync
      summary: Apply the state the publisherâ€™s Content Pod declares
      description: >-
        Reads `/.well-known/roadbeat-publisher.json` on the publisherâ€™s
        Content Pod (configured pod hosts only) and applies it: `status:
        "suspended"` or `"deactivated"` deactivates the publisher, any other
        status reactivates it, and `status: "deleted"` removes the publisher
        together with all its teasers (account purge). A new `publicKey` in the
        document is taken over only with `{ timestamp, signature }` proving
        possession of that key; a new API key is then returned once (key
        rotation after losing the device). No API key needed â€” the pod
        document is the ownerâ€™s authority.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: Applied state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodSyncResultDto'
        '400':
          description: >-
            Not hosted on a known Content Pod, well-known document
            unreachable/invalid, or publisher not listed in it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: Publisher not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRotationProofDto'
  /api/v1/publishers:
    get:
      operationId: PublishersController_findAll
      summary: List all publishers
      description: >-
        Public fields only — contact person and e-mail are never part of this
        response.
      parameters:
        - name: type
          required: false
          in: query
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
        - name: trust_level
          required: false
          in: query
          schema:
            type: string
        - name: skip
          required: false
          in: query
          schema:
            type: number
        - name: take
          required: false
          in: query
          schema:
            type: number
        - name: q
          required: false
          in: query
          description: Text search in name and domain
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPublisherListDto'
      tags:
        - publishers
  /api/v1/publishers/{id}:
    get:
      operationId: PublishersController_findById
      summary: Get publisher by ID
      description: >-
        Public fields only — contact person and e-mail are never part of this
        response.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPublisherDto'
      tags:
        - publishers
    put:
      operationId: PublishersController_update
      summary: Update publisher details (admin)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublisherDto'
      responses:
        '200':
          description: ''
      tags:
        - publishers
  /api/v1/publishers/{id}/contact:
    get:
      operationId: PublishersController_getContact
      summary: Get publisher contact details (admin)
      description: >-
        Contact person and e-mail given at registration — for the node operator
        only (GDPR).
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherContactResponseDto'
      tags:
        - publishers
  /api/v1/publishers/{id}/rotate-key:
    post:
      operationId: PublishersController_rotateApiKey
      summary: Rotate publisher API key (admin)
      description: >-
        Generates a new API key for the publisher. The old key is immediately
        invalidated.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - publishers
  /api/v1/publishers/{id}/verify-domain:
    post:
      operationId: PublishersController_verifyDomain
      summary: Retry domain verification
      description: >-
        Re-checks DNS TXT record at `_roadbeat.{domain}` for the verification
        token.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - publishers
  /api/v1/publishers/{id}/verify-pod:
    post:
      operationId: PublishersController_verifyPod
      summary: Verify the publisher via its Content Pod
      description: >-
        For publishers without an own domain (local mobile accounts): checks
        `/.well-known/roadbeat-publisher.json` on the Content Pod of the
        publisher (public key + publisher id). Only configured pod hosts are
        fetched.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: >-
            Verification result. On success an `unverified` publisher becomes
            `pod_verified`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodVerificationResultDto'
        '404':
          description: Publisher not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags:
        - publishers
  /api/v1/publishers/{id}/suspend:
    post:
      operationId: PublishersController_suspend
      summary: Suspend a publisher (admin)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - publishers
  /api/v1/publishers/{id}/stats:
    get:
      operationId: PublishersController_getStats
      summary: Get publisher statistics
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - publishers
  /api/v1/teasers:
    post:
      operationId: IngestController_publishTeaser
      summary: Publish a teaser
      description: >-
        Index a new content teaser into Elasticsearch. The teaser is validated,
        optionally signature-verified, and indexed into the
        content-type-specific index (`roadbeat-content-{type}`).
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key for authentication
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTeaserDto'
      responses:
        '201':
          description: ''
      tags:
        - teasers
  /api/v1/teasers/{teaserId}:
    put:
      operationId: IngestController_updateTeaser
      summary: Update a teaser
      description: >-
        Update an existing teaser. Publisher must own the teaser. Increments the
        teaser_version counter.
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key for authentication
          required: true
          schema:
            type: string
        - name: teaserId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishTeaserDto'
      responses:
        '200':
          description: ''
      tags:
        - teasers
    delete:
      operationId: IngestController_removeTeaser
      summary: Remove a teaser
      description: Delete a teaser from the index. Publisher must own the teaser.
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key for authentication
          required: true
          schema:
            type: string
        - name: teaserId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - teasers
    get:
      operationId: IngestController_getTeaser
      summary: Get a teaser by ID
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key for authentication
          required: true
          schema:
            type: string
        - name: teaserId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - teasers
  /api/v1/teasers/batch:
    post:
      operationId: IngestController_batchOperations
      summary: Batch operations (max 100)
      description: >-
        Execute multiple index/update/delete operations in a single request.
        Each operation is processed sequentially with individual error handling.
      parameters:
        - name: X-Publisher-Key
          in: header
          description: Publisher API key for authentication
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchOperationsDto'
      responses:
        '201':
          description: ''
      tags:
        - teasers
  /api/v1/teasers/{contentType}/{slug}:
    get:
      operationId: TeaserPublicController_getTeaserBySlug
      summary: Get a teaser by content type and slug (public)
      description: >-
        Fetch a single indexed teaser document by its content type and slug.
        Used by consumer BFF APIs (Studio, Web Client) to resolve a teaser
        before fetching full body content from the canonical Content Pod URL. No
        publisher authentication required.
      parameters:
        - name: contentType
          required: true
          in: path
          schema:
            type: string
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - teasers
  /api/v1/nodes:
    get:
      operationId: NodesController_getDirectory
      summary: Get node directory
      description: >-
        Returns all healthy/degraded peer discovery nodes. Used by clients to
        find the best node for their region/content type.
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - nodes
  /api/v1/nodes/all:
    get:
      operationId: NodesController_getAllNodes
      summary: Get all nodes (admin)
      description: Returns all nodes including unhealthy/offline ones.
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - nodes
  /api/v1/nodes/{nodeId}:
    get:
      operationId: NodesController_getNode
      summary: Get node by ID
      parameters:
        - name: nodeId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - nodes
    put:
      operationId: NodesController_updateNode
      summary: Update node info (admin)
      parameters:
        - name: nodeId
          required: true
          in: path
          schema:
            type: string
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - nodes
    delete:
      operationId: NodesController_removeNode
      summary: Remove a node from directory (admin)
      parameters:
        - name: nodeId
          required: true
          in: path
          schema:
            type: string
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - nodes
  /api/v1/nodes/register:
    post:
      operationId: NodesController_registerNode
      summary: Register a peer node (admin)
      description: >-
        Register a new discovery node in the peer directory. Returns the node
        info with assigned node_id.
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - nodes
  /api/v1/nodes/{nodeId}/heartbeat:
    post:
      operationId: NodesController_heartbeat
      summary: Node heartbeat
      description: >-
        Called periodically by peer nodes to signal liveness. Optionally
        includes stats update.
      parameters:
        - name: nodeId
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - nodes
  /api/v1/admin/config:
    get:
      operationId: AdminController_getNodeConfig
      summary: Get node configuration
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - admin
    put:
      operationId: AdminController_upsertNodeConfig
      summary: Create or update node configuration
      description: >-
        Upserts the node identity, operator info, content types, region, and
        legal HTML.
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - admin
  /api/v1/admin/cache/stats:
    get:
      operationId: AdminController_getCacheStats
      summary: Get Redis cache statistics
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - admin
  /api/v1/admin/cache/invalidate:
    post:
      operationId: AdminController_invalidateCache
      summary: Invalidate cache by pattern
      description: >-
        Pass `{ "pattern": "search:*" }` to clear search cache, or `{ "pattern":
        "all" }` to clear everything.
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - admin
  /api/v1/admin/cache/invalidate/search:
    post:
      operationId: AdminController_invalidateSearchCache
      summary: Invalidate search and suggestions cache
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - admin
  /api/v1/admin/elasticsearch/health:
    get:
      operationId: AdminController_getClusterHealth
      summary: Get Elasticsearch cluster health
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - admin
  /api/v1/admin/elasticsearch/refresh:
    post:
      operationId: AdminController_refreshIndices
      summary: Refresh all content indices
      description: Forces near-real-time visibility of recently indexed documents.
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - admin
  /api/v1/admin/incidents:
    get:
      operationId: AdminController_getIncidents
      summary: Get recent incidents
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            type: number
      responses:
        '200':
          description: ''
      tags:
        - admin
    post:
      operationId: AdminController_createIncident
      summary: Create an incident
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - admin
  /api/v1/admin/incidents/{id}/resolve:
    post:
      operationId: AdminController_resolveIncident
      summary: Resolve an incident
      parameters:
        - name: X-Admin-Key
          in: header
          description: Admin API key for authentication
          required: true
          schema:
            type: string
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
      tags:
        - admin
  /api/web/v1/node-info:
    get:
      operationId: WebsiteController_getNodeInfo
      summary: Node identity and operator info
      parameters: []
      responses:
        '200':
          description: ''
