info:
  title: roadbeat Discovery Node API
  description: >-
    Distributed search and content discovery server for the roadbeat ecosystem.
    Provides faceted search, geographic filtering, goal-driven discovery, and
    semantic search.
  version: 1.0.0
  contact: {}
tags:
  - name: search
    description: Content search and discovery
  - name: teasers
    description: Content teaser ingest
  - name: publishers
    description: Publisher management
  - name: nodes
    description: Node directory and federation
  - name: health
    description: Health checks and status
  - name: stats
    description: Statistics and metrics
  - name: web
    description: Website internal API
  - name: embedding
    description: Embeddings, semantic search and similar content
  - name: statistics
    description: Index, publisher and performance statistics
  - name: admin
    description: Node administration (admin key)
  - name: website
    description: Public transparency website API
servers:
  - url: https://discover.roadbeat.net
    description: Production
  - url: http://localhost:3300
    description: Local Development
components:
  securitySchemes:
    publisher-key:
      type: apiKey
      in: header
      name: X-Publisher-Key
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    admin-key:
      type: apiKey
      in: header
      name: X-Admin-Key
  schemas:
    SearchQueryDto:
      type: object
      properties:
        text:
          type: string
          description: Full-text search query string
          example: renewable energy Germany
        fields:
          description: >-
            Fields to search (with optional boosting). Defaults to headline +
            description + tags.
          example:
            - overview.headline.de^3
            - overview.description.en^2
          type: array
          items:
            type: string
    GeoPointDto:
      type: object
      properties:
        lat:
          type: number
          example: 52.52
        lon:
          type: number
          example: 13.405
      required:
        - lat
        - lon
    GeoFilterDto:
      type: object
      properties:
        center:
          description: Center point for geo distance search
          allOf:
            - $ref: '#/components/schemas/GeoPointDto'
        distance:
          type: string
          description: Maximum distance from center (e.g. "50km", "100mi")
          example: 50km
      required:
        - center
        - distance
    GeoBoundingBoxDto:
      type: object
      properties:
        top_left:
          description: Top-left corner
          allOf:
            - $ref: '#/components/schemas/GeoPointDto'
        bottom_right:
          description: Bottom-right corner
          allOf:
            - $ref: '#/components/schemas/GeoPointDto'
      required:
        - top_left
        - bottom_right
    PaginationDto:
      type: object
      properties:
        from:
          type: number
          description: Offset (0-indexed)
          default: 0
        size:
          type: number
          description: Number of results per page
          default: 20
    SearchRequestDto:
      type: object
      properties:
        query:
          description: Text search query
          allOf:
            - $ref: '#/components/schemas/SearchQueryDto'
        content_types:
          description: Content types to search (e.g. ["news", "events"])
          example:
            - news
          type: array
          items:
            type: string
        filters:
          type: object
          description: Filter map. Keys are dot-path field names, values are filter values.
          example:
            classification.categories:
              - politics
              - economy
            classification.tags:
              - climate
            temporal.date_published:
              gte: '2026-01-01'
              lte: '2026-12-31'
            geographic.country_codes:
              - DE
              - AT
            access.is_free: true
            access.languages:
              - de
              - en
            publisher.verified: true
            publisher.trust_level:
              - established
              - trusted
        geo:
          description: Geographic distance filter
          allOf:
            - $ref: '#/components/schemas/GeoFilterDto'
        geo_bounding_box:
          description: Bounding box filter
          allOf:
            - $ref: '#/components/schemas/GeoBoundingBoxDto'
        sort:
          description: >-
            Sort order. Array of `{ field: "asc"|"desc" }` objects. Default:
            relevance then date.
          example:
            - temporal.date_published: desc
          type: array
          items:
            type: string
        pagination:
          description: Pagination options
          allOf:
            - $ref: '#/components/schemas/PaginationDto'
        aggregations:
          type: object
          description: >-
            Custom aggregation definitions. If omitted, default facets are
            returned.
        highlight:
          type: boolean
          description: Whether to include highlights in results
          default: true
        search_mode:
          type: string
          description: >-
            Enable semantic (vector) search. "hybrid" combines BM25 keyword +
            kNN vector scoring. "semantic_only" uses pure vector search.
            Default: keyword only (no vectors).
          enum:
            - hybrid
            - semantic_only
        keyword_weight:
          type: number
          description: >-
            Weight for keyword (BM25) score in hybrid mode (0.0-1.0). Vector
            weight = 1 - keyword_weight. Default: 0.7 (favor keywords).
          default: 0.7
    UserContextDto:
      type: object
      properties:
        location:
          type: object
          description: User location (for geographic relevance)
        languages:
          description: Preferred languages
          example:
            - de
            - en
          type: array
          items:
            type: string
        preferred_content_types:
          description: User preferred content types
          type: array
          items:
            type: string
    GoalSearchDto:
      type: object
      properties:
        goal_template_id:
          type: string
          description: >-
            Goal template ID (path in schemas/goals/, e.g.
            "personal/career-job-search")
          example: personal/career-job-search
        goal_parameters:
          type: object
          description: >-
            Goal-specific parameter substitutions (e.g. `{ "city": "Berlin",
            "field": "Software Engineering" }`)
          example:
            city: Berlin
            field: Software Engineering
        user_context:
          description: User context for relevance tuning
          allOf:
            - $ref: '#/components/schemas/UserContextDto'
        results_per_query:
          type: number
          description: Max results per content query
          default: 10
        max_total_results:
          type: number
          description: Max total results across all queries
          default: 50
      required:
        - goal_template_id
    GoalContentQueryDto:
      type: object
      properties:
        content_format:
          type: string
          description: Content type filter (e.g. "event", "course")
        filters:
          type: object
          description: 'Goal catalog filters (e.g. { "category.tags": ["concert"] })'
        relevance:
          type: string
          description: Relevance weighting from goal catalog
          enum:
            - high
            - medium
            - low
        goal_id:
          type: string
          description: Goal ID this content_query belongs to (for attribution)
    GoalBatchSearchDto:
      type: object
      properties:
        content_queries:
          description: All resolved content_queries to search (from one or many goals)
          type: array
          items:
            $ref: '#/components/schemas/GoalContentQueryDto'
        query:
          description: >-
            Free text within the goals: hits must match the text and at least
            one content query (not in random mode)
          allOf:
            - $ref: '#/components/schemas/SearchQueryDto'
        content_types:
          description: Content types to restrict results (e.g. ["event", "news"])
          example:
            - event
          type: array
          items:
            type: string
        filters:
          type: object
          description: User-level filters applied globally (date range, language, etc.)
        geo:
          description: Geographic distance filter
          allOf:
            - $ref: '#/components/schemas/GeoFilterDto'
        pagination:
          description: Pagination options
          allOf:
            - $ref: '#/components/schemas/PaginationDto'
        sort:
          description: 'Sort order. Default: relevance then date.'
          type: array
          items:
            type: string
        random:
          type: boolean
          description: Enable random mode (for surprise/serendipity). Overrides sort.
          default: false
        random_seed:
          type: number
          description: Seed for random_score (same seed = same order within a session)
      required:
        - content_queries
    PublisherContactDto:
      type: object
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: publisher@example.com
      required:
        - name
        - email
    RegisterPublisherDto:
      type: object
      properties:
        name:
          type: string
          description: Publisher display name
          example: EnergyNews DE
        type:
          type: string
          description: Publisher type
          enum:
            - media
            - organization
            - government
            - individual
            - academic
          example: media
        domain:
          type: string
          description: Publisher domain for verification
          example: energynews.de
        studio_node_url:
          type: string
          description: Studio node URL for callback communication
          example: https://studio.energynews.de
        public_key:
          type: string
          description: PEM-encoded Ed25519 public key for teaser signature verification
        content_types:
          description: Content types this publisher will publish
          example:
            - news
            - events
          type: array
          items:
            type: string
        contact:
          description: Publisher contact information
          allOf:
            - $ref: '#/components/schemas/PublisherContactDto'
        verification_token:
          type: string
          description: >-
            DNS TXT record verification token (set _roadbeat.example.com TXT
            "roadbeat-verify=TOKEN")
          example: abc123-verification-token
      required:
        - name
        - type
        - domain
        - public_key
        - content_types
        - contact
    PublicPublisherDto:
      type: object
      properties:
        id:
          type: string
          example: 6f1c2a9e-4b1d-4d7a-9f3e-2c8b5a1d0e42
        name:
          type: string
          example: EnergyNews DE
        type:
          type: string
          example: media
        domain:
          type: string
          example: energynews.de
        studioNodeUrl:
          type: object
          nullable: true
          example: https://studio.energynews.de
        publicKey:
          type: string
          description: PEM-encoded Ed25519 public key (teaser signature verification)
        avatarUrl:
          type: object
          nullable: true
          description: Optional picture (owner opt-in)
        description:
          type: object
          nullable: true
          description: '"About" text per two-letter language'
          example:
            en: Energy news from Germany
            de: Energie-Nachrichten aus Deutschland
        contentTypes:
          example:
            - news
            - events
          type: array
          items:
            type: string
        verificationStatus:
          type: string
          example: domain_verified
        trustLevel:
          type: string
          example: new
        rateLimits:
          type: object
          example:
            teasers_per_day: 1000
            requests_per_minute: 120
        federationOptOut:
          type: boolean
        ownerDeactivated:
          type: boolean
        documentCount:
          type: number
        lastIngestAt:
          type: string
          nullable: true
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - domain
        - publicKey
        - contentTypes
        - verificationStatus
        - trustLevel
        - rateLimits
        - federationOptOut
        - ownerDeactivated
        - documentCount
        - isActive
        - createdAt
        - updatedAt
    PublicPublisherListDto:
      type: object
      properties:
        publishers:
          type: array
          items:
            $ref: '#/components/schemas/PublicPublisherDto'
        total:
          type: number
      required:
        - publishers
        - total
    PublisherContactDetailsDto:
      type: object
      properties:
        name:
          type: object
          nullable: true
          example: John Doe
        email:
          type: string
          example: publisher@example.com
      required:
        - email
    PublisherContactResponseDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        contact:
          $ref: '#/components/schemas/PublisherContactDetailsDto'
      required:
        - id
        - name
        - contact
    UpdatePublisherDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        studio_node_url:
          type: string
        public_key:
          type: string
        content_types:
          type: array
          items:
            type: string
        contact:
          $ref: '#/components/schemas/PublisherContactDto'
    PublishTeaserDto:
      type: object
      properties:
        content_type:
          type: string
          description: Content type (must match an existing index pattern)
          example: news
        teaser:
          type: object
          description: Full teaser document conforming to the content index template
        signature:
          type: string
          description: Base64-encoded Ed25519 signature of the canonical teaser JSON
      required:
        - content_type
        - teaser
    BatchOperationDto:
      type: object
      properties:
        action:
          type: string
          description: Operation type
          enum:
            - index
            - update
            - delete
        content_type:
          type: string
          description: Content type
        teaser_id:
          type: string
          description: Teaser ID (required for update/delete)
        teaser:
          type: object
          description: Teaser document (required for index/update)
        signature:
          type: string
          description: Signature for the teaser
      required:
        - action
        - content_type
    BatchOperationsDto:
      type: object
      properties:
        operations:
          description: Array of batch operations (max 100)
          type: array
          items:
            $ref: '#/components/schemas/BatchOperationDto'
      required:
        - operations
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          type: string
          example: avatar_url must point into your own verified Content Pod
        error:
          type: string
          example: Bad Request
    OwnPublisherDto:
      type: object
      description: >-
        The publisher record as returned to its OWNER (registration and
        self-service responses). Contains all public fields plus the contact
        data; the API key hash is never returned.
      allOf:
        - $ref: '#/components/schemas/PublicPublisherDto'
      properties:
        contactName:
          type: string
          nullable: true
          example: Tech Team
        contactEmail:
          type: string
          example: tech@energynews.de
    PublisherIdentityDto:
      type: object
      properties:
        id:
          type: string
          example: 6f1c2a9e-4b1d-4d7a-9f3e-2c8b5a1d0e42
        name:
          type: string
          example: Jane Doe
        domain:
          type: string
          example: jane.pods.roadbeat.net
      required:
        - id
        - name
        - domain
    KeyRotationProofDto:
      type: object
      description: >-
        Proof of possession of a (new) Ed25519 key: the base64 signature of
        `roadbeat-key-rotation:<publisherId>:<timestamp>`, made with that key.
        The timestamp must be at most 5 minutes old.
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-11-09T10:15:00.000Z'
        signature:
          type: string
          description: Base64-encoded Ed25519 signature
          example: q3JkZ2Vuâ€¦
    UpdateOwnPublicKeyDto:
      type: object
      allOf:
        - $ref: '#/components/schemas/KeyRotationProofDto'
      properties:
        public_key:
          type: string
          description: New PEM-encoded Ed25519 public key (SPKI)
          example: |-
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAâ€¦
            -----END PUBLIC KEY-----
      required:
        - public_key
        - timestamp
        - signature
    UpdateOwnDescriptionDto:
      type: object
      properties:
        description:
          type: object
          nullable: true
          description: >-
            "About" text per two-letter language code (plain text, max. 2,000
            characters each, max. 30 languages). `null` or `{}` removes the
            text; empty entries are dropped.
          additionalProperties:
            type: string
            maxLength: 2000
          example:
            en: Energy news from Germany
            de: Energie-Nachrichten aus Deutschland
    UpdateOwnAvatarDto:
      type: object
      properties:
        avatar_url:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            URL of a file inside the publisherâ€™s own verified Content Pod
            (`pod_verified` publishers only). `null` or an empty string removes
            the picture.
          example: https://jane.pods.roadbeat.net/assets/avatar.webp
    PodVerificationResultDto:
      type: object
      properties:
        verified:
          type: boolean
          example: false
        reason:
          type: string
          description: Why the verification failed (only when `verified` is false)
          example: public key does not match
      required:
        - verified
    PodSyncResultDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - active
            - deactivated
            - deleted
          description: >-
            State applied from the podâ€™s well-known document. `deleted`: the
            publisher and all its teasers were removed.
        key_rotated:
          type: boolean
          description: Whether the public key declared by the pod was taken over
        api_key:
          type: string
          description: >-
            New publisher API key â€” returned ONCE, only when `key_rotated` is
            true. The old key stops working.
          example: rb_pub_4f9câ€¦
        reason:
          type: string
          description: >-
            Set when the pod declares a new key but no valid proof of possession
            was sent
        teasers_deleted:
          type: number
          description: 'Number of removed teasers (only for `status: deleted`)'
      required:
        - status
        - key_rotated
    SimilarTeasersResponseDto:
      type: object
      properties:
        source_teaser_id:
          type: string
          example: energynews-de:article-123
        similar_count:
          type: number
          example: 10
        method:
          type: string
          enum:
            - vector
            - more_like_this
          description: >-
            How the results were found: kNN over embedding vectors, or
            Elasticsearch `more_like_this` over the text fields
        results:
          type: array
          description: >-
            Similar teasers (`_id`, `_index`, `_score` plus teaser_id,
            content_type, identifier, overview, classification, publisher)
          items:
            type: object
        error:
          type: string
          description: Set instead of the fields above when the teaser was not found
          example: Teaser not found
        teaser_id:
          type: string
          description: Set together with `error`
